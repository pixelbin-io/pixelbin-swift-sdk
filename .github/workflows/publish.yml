name: Publish Swift Package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Swift
        uses: swift-actions/setup-swift@v1
        
      - name: Build and test
        run: |
          swift build
          swift test
          
      - name: Tag and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -A 1 'version:' Package.swift | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+')
          git tag $VERSION
          git push origin $VERSION
          
      # Swift packages are automatically available via Swift Package Manager once tagged
